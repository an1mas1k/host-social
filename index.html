<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot — социальная сеть</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-dark-1: #070a16; --bg-dark-2: #101126; --bg-dark-3: #090714;
    --accent-1: #ff24a8; --accent-2: #8e35ff; --accent-3: #ff38c6;
    --border: #30416c; --border-soft: rgba(255,255,255,0.05); --border-strong: #34466f;
    --text-primary: #fff; --text-secondary: #9da4c5; --text-muted: #8993b4;
    --input-bg: rgba(20,29,54,0.82);
    --card-bg-1: rgba(12,18,38,0.96); --card-bg-2: rgba(5,10,23,0.96);
    --radius-sm: 13px; --radius-md: 15px; --radius-lg: 17px; --radius-xl: 25px;
    --shadow-card: 0 0 70px rgba(0,0,0,0.45), 0 0 40px rgba(180,0,255,0.08);
    --shadow-button: 0 10px 30px rgba(207,28,220,0.28);
    --transition: 0.25s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Inter', Arial, sans-serif; min-height: 100vh; color: var(--text-primary);
    background: radial-gradient(circle at 70% 30%, rgba(150,30,120,0.30), transparent 35%),
        linear-gradient(120deg, var(--bg-dark-1), var(--bg-dark-2) 50%, var(--bg-dark-3));
}
body::before {
    content:""; position:fixed; inset:0;
    background: radial-gradient(circle at 20% 70%, rgba(255,0,150,0.12), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(100,50,255,0.15), transparent 35%);
    pointer-events:none; z-index:0;
}
header {
    height:76px; width:100%; display:flex; align-items:center; padding:0 6%;
    background: rgba(5,8,20,0.88); border-bottom: 1px solid var(--border-soft);
    position:relative; z-index:10;
}
.logo { display:flex; align-items:center; font-size:32px; font-weight:700; margin-right:90px; cursor:pointer; }
.logo-fire { font-size:38px; margin-right:9px; filter: drop-shadow(0 0 8px #ff1cae); }
.logo-text { background: linear-gradient(90deg,#fff,#d8d8ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
nav { display:flex; gap:42px; }
nav a { color: var(--text-secondary); font-size:15px; cursor:pointer; transition: color var(--transition); }
nav a:hover, nav a.active { color: var(--text-primary); }
.header-right { margin-left:auto; display:flex; align-items:center; gap:25px; }
.search { width:250px; height:42px; border-radius:22px; background: rgba(25,30,55,0.8); display:flex; align-items:center; padding:0 17px; font-size:14px; color: var(--text-muted); }
.search input { background:transparent; border:none; outline:none; color:var(--text-primary); font-size:14px; width:100%; font-family:inherit; }
.search-icon { font-size:20px; margin-right:10px; }
.login-top { border:1px solid #34406b; background:transparent; color:#c7cbe4; padding:11px 24px; border-radius: var(--radius-sm); cursor:pointer; font-size:14px; font-family:inherit; }
.login-top:hover { border-color: var(--accent-1); color:#fff; }
.user-info { display:flex; align-items:center; gap:15px; cursor:pointer; padding:5px 10px 5px 5px; border-radius:30px; }
.user-info:hover { background: rgba(255,255,255,0.05); }
.user-avatar { width:42px; height:42px; border-radius:50%; background: linear-gradient(135deg,var(--accent-1),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; overflow:hidden; flex-shrink:0; }
.user-avatar img { width:100%; height:100%; object-fit:cover; }
.user-name { font-size:15px; }
main { min-height: calc(100vh - 76px); padding:55px 8%; position:relative; z-index:1; }
.main-auth { display:flex; align-items:center; min-height: calc(100vh - 76px - 110px); }
.hero { width:48%; padding-left:6%; }
.hero-logo { display:flex; align-items:center; font-size:72px; font-weight:700; margin-bottom:15px; }
.hero-fire { font-size:86px; margin-right:20px; filter: drop-shadow(0 0 15px #ff20bb) drop-shadow(0 0 35px #8c20ff); }
.hero-title { background: linear-gradient(90deg,#fff,#c7bfff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.hero-subtitle { color:#9198b8; font-size:22px; letter-spacing:4px; margin-left:15px; }
.registration { width:620px; margin-left:auto; background: linear-gradient(145deg,var(--card-bg-1),var(--card-bg-2)); border:1px solid var(--border-strong); border-radius: var(--radius-xl); padding:50px 58px; box-shadow: var(--shadow-card); }
.registration h1 { font-size:46px; margin-bottom:12px; background: linear-gradient(90deg,#fff,#d890ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.description { color:#9aa4c7; font-size:17px; margin-bottom:35px; }
.input { height:61px; width:100%; margin-bottom:17px; border-radius: var(--radius-md); border:1px solid var(--border); background: var(--input-bg); color:#fff; font-family:inherit; font-size:16px; padding:0 20px; outline:none; transition: border-color var(--transition); }
.input::placeholder { color: var(--text-muted); }
.input:focus { border-color:#bd36ff; box-shadow: 0 0 0 3px rgba(180,40,255,0.12); }
.input.invalid { border-color:#ff4d6d; }
.input:disabled { opacity:0.6; }
.password-wrapper { position:relative; }
.password-wrapper .input { padding-right:55px; }
.eye { position:absolute; right:16px; top:50%; transform:translateY(-50%); width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:#aeb9d9; background:transparent; border:none; cursor:pointer; font-size:20px; border-radius:50%; }
.eye:hover { color:#fff; }
.register-button { width:100%; height:62px; border:none; border-radius: var(--radius-lg); margin-top:15px; color:#fff; font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; background: linear-gradient(90deg,var(--accent-1),var(--accent-2)); box-shadow: var(--shadow-button); transition: transform var(--transition); }
.register-button:hover { transform: translateY(-2px); }
.register-button:disabled { opacity:0.6; cursor:not-allowed; }
.or { display:flex; align-items:center; gap:15px; margin:30px 0 18px; color:#8992b0; font-size:13px; }
.or::before, .or::after { content:""; height:1px; flex:1; background:#283451; }
.social-buttons { display:flex; gap:18px; }
.social-button { flex:1; height:54px; border-radius: var(--radius-md); border:1px solid #2f3d63; background:#10182d; color:#fff; font-family:inherit; font-size:15px; cursor:pointer; }
.social-button:hover { border-color:#9340ff; background:#171f3a; }
.social-button.vk { color:#72a7ff; }
.already { text-align:center; margin-top:28px; color:#8e97b7; font-size:14px; }
.already a { color: var(--accent-3); font-weight:700; cursor:pointer; text-decoration:none; }
.already a:hover { text-decoration:underline; }
.error-message { color:#ff4d6d; font-size:14px; margin-top:-8px; margin-bottom:10px; min-height:18px; opacity:0; transition: opacity var(--transition); }
.error-message.visible { opacity:1; }
.success-message { color:#4ade80; font-size:14px; margin-top:-8px; margin-bottom:10px; min-height:18px; opacity:0; transition: opacity var(--transition); }
.success-message.visible { opacity:1; }
.page { display:none; }
.page.active { display:block; }
.home-container { max-width:900px; margin:0 auto; }
.welcome-card { background: linear-gradient(145deg,var(--card-bg-1),var(--card-bg-2)); border:1px solid var(--border-strong); border-radius: var(--radius-xl); padding:50px; box-shadow: var(--shadow-card); text-align:center; }
.welcome-avatar { width:120px; height:120px; border-radius:50%; margin:0 auto 25px; background: linear-gradient(135deg,var(--accent-1),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:700; box-shadow: 0 0 40px rgba(207,28,220,0.4); overflow:hidden; }
.welcome-avatar img { width:100%; height:100%; object-fit:cover; }
.welcome-card h1 { font-size:42px; margin-bottom:15px; background: linear-gradient(90deg,#fff,#d890ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.welcome-card p { color:#9aa4c7; font-size:17px; margin-bottom:30px; }
.welcome-actions { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }
.btn-secondary { height:54px; padding:0 35px; border:1px solid #34406b; border-radius: var(--radius-md); background:transparent; color:#c7cbe4; font-family:inherit; font-size:15px; cursor:pointer; }
.btn-secondary:hover { border-color: var(--accent-1); color:#fff; }
.profile-container { max-width:700px; margin:0 auto; }
.profile-card { background: linear-gradient(145deg,var(--card-bg-1),var(--card-bg-2)); border:1px solid var(--border-strong); border-radius: var(--radius-xl); padding:50px 58px; box-shadow: var(--shadow-card); }
.profile-card h1 { font-size:42px; margin-bottom:12px; background: linear-gradient(90deg,#fff,#d890ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.profile-card .description { margin-bottom:40px; }
.avatar-section { display:flex; align-items:center; gap:30px; margin-bottom:35px; padding-bottom:35px; border-bottom:1px solid var(--border-soft); }
.avatar-preview { width:110px; height:110px; border-radius:50%; background: linear-gradient(135deg,var(--accent-1),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:700; overflow:hidden; flex-shrink:0; }
.avatar-preview img { width:100%; height:100%; object-fit:cover; }
.avatar-controls { display:flex; flex-direction:column; gap:10px; }
.avatar-controls > label:first-child { font-size:14px; color: var(--text-muted); }
.btn-upload { display:inline-block; padding:12px 24px; border-radius: var(--radius-sm); border:1px solid var(--accent-2); background:transparent; color:#fff; font-family:inherit; font-size:14px; cursor:pointer; text-align:center; }
.btn-upload:hover { background: rgba(142,53,255,0.15); }
.btn-remove { display:inline-block; padding:10px 24px; border-radius: var(--radius-sm); border:1px solid #34406b; background:transparent; color: var(--text-muted); font-family:inherit; font-size:13px; cursor:pointer; }
.btn-remove:hover { color:#ff4d6d; border-color:#ff4d6d; }
.field-label { display:block; font-size:14px; color: var(--text-muted); margin-bottom:8px; margin-left:4px; }
.field-group { margin-bottom:20px; }
.field-hint { font-size:13px; color: var(--text-muted); margin-top:-10px; margin-bottom:17px; margin-left:4px; }
.person-item { display:flex; align-items:center; gap:15px; padding:15px; border-radius: var(--radius-md); background: rgba(20,29,54,0.5); margin-bottom:12px; border:1px solid var(--border-soft); }
.person-avatar { width:50px; height:50px; border-radius:50%; background: linear-gradient(135deg,var(--accent-1),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; overflow:hidden; flex-shrink:0; }
.person-avatar img { width:100%; height:100%; object-fit:cover; }
.person-info { flex:1; }
.person-name { font-size:16px; font-weight:600; margin-bottom:3px; }
.person-date { font-size:13px; color: var(--text-muted); }
.hidden { display:none !important; }
@media (max-width: 1100px) {
    nav { display:none; }
    .hero { display:none; }
    .main-auth { justify-content:center; }
    .registration { margin:0; }
}
@media (max-width: 650px) {
    header { padding:0 20px; }
    .search { display:none; }
    .logo { margin:0; }
    main { padding:20px; }
    .registration, .profile-card, .welcome-card { width:100%; padding:35px 25px; }
    .avatar-section { flex-direction:column; text-align:center; }
}
</style>
</head>
<body>

<header>
    <a class="logo" id="logo-link">
        <span class="logo-fire">🔥</span>
        <span class="logo-text">Hot</span>
    </a>
    <nav id="main-nav">
        <a id="nav-home" class="active">Главная</a>
        <a id="nav-people">Люди</a>
        <a id="nav-profile">Настройки</a>
    </nav>
    <div class="header-right">
        <div class="search">
            <span class="search-icon">⌕</span>
            <input type="search" placeholder="Поиск..." disabled>
        </div>
        <button type="button" class="login-top" id="header-login-btn">Войти</button>
        <div class="user-info hidden" id="header-user">
            <div class="user-avatar" id="header-avatar">?</div>
            <span class="user-name" id="header-username"></span>
        </div>
    </div>
</header>

<main>

<div class="page active" id="page-auth">
    <div class="main-auth">
        <section class="hero">
            <div class="hero-logo">
                <span class="hero-fire">🔥</span>
                <span class="hero-title">Hot</span>
            </div>
            <p class="hero-subtitle">Социальная сеть</p>
        </section>
        <section class="registration">
            <h1 id="auth-title">Регистрация</h1>
            <p class="description" id="auth-description">Создай аккаунт и начни общаться</p>
            <form id="register-form" novalidate>
                <input id="username" class="input" type="text" placeholder="Имя пользователя" minlength="3" maxlength="20">
                <input id="email" class="input" type="email" placeholder="Почта">
                <div class="password-wrapper">
                    <input id="password" class="input" type="password" placeholder="Пароль">
                    <button type="button" class="eye" data-target="password">◉</button>
                </div>
                <div class="password-wrapper" id="password2-wrapper">
                    <input id="password2" class="input" type="password" placeholder="Повторите пароль">
                    <button type="button" class="eye" data-target="password2">◉</button>
                </div>
                <p id="error" class="error-message"></p>
                <button type="submit" class="register-button" id="submit-btn">Создать аккаунт →</button>
            </form>
            <div class="or" id="or-divider">или</div>
            <div class="social-buttons" id="social-block">
                <button type="button" class="social-button">Google</button>
                <button type="button" class="social-button vk">VK</button>
            </div>
            <p class="already" id="switch-line">Уже есть аккаунт? <a id="switch-mode">Войти</a></p>
        </section>
    </div>
</div>

<div class="page" id="page-home">
    <div class="home-container">
        <div class="welcome-card">
            <div class="welcome-avatar" id="home-avatar">?</div>
            <h1 id="home-title">Привет!</h1>
            <p id="home-text">Ты успешно вошёл в Hot</p>
            <div class="welcome-actions">
                <button type="button" class="btn-secondary" id="home-profile-btn">Настройки профиля</button>
                <button type="button" class="btn-secondary" id="home-logout-btn">Выйти</button>
            </div>
        </div>
    </div>
</div>

<div class="page" id="page-profile">
    <div class="profile-container">
        <div class="profile-card">
            <h1>Настройки профиля</h1>
            <p class="description">Измени свой ник и аватар</p>
            <form id="profile-form" novalidate>
                <div class="avatar-section">
                    <div class="avatar-preview" id="profile-avatar-preview">?</div>
                    <div class="avatar-controls">
                        <label>Аватар (JPG, PNG, до 10 МБ)</label>
                        <label class="btn-upload" for="avatar-input">Загрузить картинку</label>
                        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                        <button type="button" class="btn-remove" id="avatar-remove-btn">Удалить аватар</button>
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label">Ник</label>
                    <input id="profile-username" class="input" type="text" minlength="3" maxlength="20">
                    <div class="field-hint">От 3 до 20 символов</div>
                </div>
                <div class="field-group">
                    <label class="field-label">Email</label>
                    <input id="profile-email" class="input" type="email" disabled>
                    <div class="field-hint">Email изменить нельзя</div>
                </div>
                <p id="profile-error" class="error-message"></p>
                <p id="profile-success" class="success-message"></p>
                <button type="submit" class="register-button" id="profile-submit-btn">Сохранить изменения</button>
                <div style="margin-top:20px; text-align:center;">
                    <button type="button" class="btn-secondary" id="profile-back-btn">Назад на главную</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="page" id="page-people">
    <div class="profile-container">
        <div class="profile-card">
            <h1>Люди</h1>
            <p class="description">Все, кто зарегистрирован в Hot</p>
            <div id="people-list"></div>
        </div>
    </div>
</div>

</main>

<script>
(function () {
    'use strict';

    var API = '';
    var STORAGE_SESSION = 'hot_session';
    var MAX_AVATAR_SIZE = 10 * 1024 * 1024;
    var AVATAR_DIMENSION = 500;

    var currentUser = null;
    var pendingAvatar = null;

    function getSession() { return localStorage.getItem(STORAGE_SESSION); }
    function setSession(u) { localStorage.setItem(STORAGE_SESSION, u); }
    function clearSession() { localStorage.removeItem(STORAGE_SESSION); }

    function apiPost(path, data) {
        return fetch(API + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(function (res) {
            return res.text().then(function (text) {
                var json;
                try { json = JSON.parse(text); }
                catch (e) { throw new Error('Сервер вернул не JSON. Возможно, server.js старый.'); }
                if (!res.ok) throw new Error(json.error || 'Ошибка');
                return json;
            });
        });
    }

    function apiGet(path) {
        return fetch(API + path).then(function (res) { return res.json(); });
    }

    var pageAuth = document.getElementById('page-auth');
    var pageHome = document.getElementById('page-home');
    var pageProfile = document.getElementById('page-profile');
    var pagePeople = document.getElementById('page-people');
    var navHome = document.getElementById('nav-home');
    var navPeople = document.getElementById('nav-people');
    var navProfile = document.getElementById('nav-profile');
    var mainNav = document.getElementById('main-nav');
    var headerLoginBtn = document.getElementById('header-login-btn');
    var headerUser = document.getElementById('header-user');
    var headerAvatar = document.getElementById('header-avatar');
    var headerUsername = document.getElementById('header-username');
    var authTitle = document.getElementById('auth-title');
    var authDescription = document.getElementById('auth-description');
    var submitBtn = document.getElementById('submit-btn');
    var form = document.getElementById('register-form');
    var usernameInput = document.getElementById('username');
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var password2Input = document.getElementById('password2');
    var password2Wrapper = document.getElementById('password2-wrapper');
    var errorEl = document.getElementById('error');
    var switchLine = document.getElementById('switch-line');
    var orDivider = document.getElementById('or-divider');
    var socialBlock = document.getElementById('social-block');
    var homeAvatar = document.getElementById('home-avatar');
    var homeTitle = document.getElementById('home-title');
    var homeText = document.getElementById('home-text');
    var homeLogoutBtn = document.getElementById('home-logout-btn');
    var homeProfileBtn = document.getElementById('home-profile-btn');
    var profileForm = document.getElementById('profile-form');
    var profileAvatarPreview = document.getElementById('profile-avatar-preview');
    var profileUsername = document.getElementById('profile-username');
    var profileEmail = document.getElementById('profile-email');
    var avatarInput = document.getElementById('avatar-input');
    var avatarRemoveBtn = document.getElementById('avatar-remove-btn');
    var profileError = document.getElementById('profile-error');
    var profileSuccess = document.getElementById('profile-success');
    var profileSubmitBtn = document.getElementById('profile-submit-btn');
    var profileBackBtn = document.getElementById('profile-back-btn');
    var peopleList = document.getElementById('people-list');

    var mode = 'register';

    function showError(m, f) {
        errorEl.textContent = m;
        errorEl.classList.add('visible');
        if (f) { f.classList.add('invalid'); f.focus(); }
    }
    function clearErrors() {
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
        var inv = form.querySelectorAll('.invalid');
        for (var i = 0; i < inv.length; i++) inv[i].classList.remove('invalid');
    }
    function setLoading(l) {
        submitBtn.disabled = l;
        submitBtn.textContent = l ? 'Подождите...' : (mode === 'register' ? 'Создать аккаунт →' : 'Войти →');
    }
    function getInitial(n) { return n ? n.charAt(0).toUpperCase() : '?'; }
    function avatarHTML(u) {
        if (u && u.avatar) return '<img src="' + u.avatar + '" alt="">';
        return getInitial(u ? u.username : '');
    }
    function bindSwitch() {
        var el = document.getElementById('switch-mode');
        if (!el) return;
        el.addEventListener('click', toggleMode);
    }

    function showPage(name) {
        pageAuth.classList.remove('active');
        pageHome.classList.remove('active');
        pageProfile.classList.remove('active');
        pagePeople.classList.remove('active');
        navHome.classList.remove('active');
        navPeople.classList.remove('active');
        navProfile.classList.remove('active');

        if (name === 'auth') {
            pageAuth.classList.add('active');
            mainNav.classList.add('hidden');
            return;
        }
        mainNav.classList.remove('hidden');
        if (name === 'home') { pageHome.classList.add('active'); navHome.classList.add('active'); }
        else if (name === 'profile') { pageProfile.classList.add('active'); navProfile.classList.add('active'); }
        else if (name === 'people') { pagePeople.classList.add('active'); navPeople.classList.add('active'); }
    }

    function setMode(m) {
        mode = m;
        clearErrors();
        form.reset();
        if (mode === 'register') {
            authTitle.textContent = 'Регистрация';
            authDescription.textContent = 'Создай аккаунт и начни общаться';
            submitBtn.textContent = 'Создать аккаунт →';
            usernameInput.classList.remove('hidden');
            emailInput.placeholder = 'Почта';
            password2Wrapper.classList.remove('hidden');
            orDivider.classList.remove('hidden');
            socialBlock.classList.remove('hidden');
            switchLine.innerHTML = 'Уже есть аккаунт? <a id="switch-mode">Войти</a>';
        } else {
            authTitle.textContent = 'Вход';
            authDescription.textContent = 'Войди в свой аккаунт';
            submitBtn.textContent = 'Войти →';
            usernameInput.classList.add('hidden');
            emailInput.placeholder = 'Имя или почта';
            password2Wrapper.classList.add('hidden');
            orDivider.classList.add('hidden');
            socialBlock.classList.add('hidden');
            switchLine.innerHTML = 'Нет аккаунта? <a id="switch-mode">Зарегистрироваться</a>';
        }
        bindSwitch();
    }

    function toggleMode() { setMode(mode === 'register' ? 'login' : 'register'); }

    function updateHeader(u) {
        if (u) {
            headerLoginBtn.classList.add('hidden');
            headerUser.classList.remove('hidden');
            headerAvatar.innerHTML = avatarHTML(u);
            headerUsername.textContent = u.username;
        } else {
            headerLoginBtn.classList.remove('hidden');
            headerUser.classList.add('hidden');
        }
    }
    function updateHome(u) {
        homeAvatar.innerHTML = avatarHTML(u);
        homeTitle.textContent = 'Привет, ' + u.username + '!';
        homeText.textContent = 'Рад видеть тебя в Hot';
    }
    function updateProfile(u) {
        profileAvatarPreview.innerHTML = avatarHTML(u);
        profileUsername.value = u.username;
        profileEmail.value = u.email || '';
        pendingAvatar = null;
    }

    function resizeImage(file, cb) {
        var r = new FileReader();
        r.onload = function (e) {
            var img = new Image();
            img.onload = function () {
                var c = document.createElement('canvas');
                c.width = AVATAR_DIMENSION; c.height = AVATAR_DIMENSION;
                var ctx = c.getContext('2d');
                var min = Math.min(img.width, img.height);
                ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, AVATAR_DIMENSION, AVATAR_DIMENSION);
                cb(c.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = function () { cb(null); };
            img.src = e.target.result;
        };
        r.onerror = function () { cb(null); };
        r.readAsDataURL(file);
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrors();
        var email = emailInput.value.trim();
        var password = passwordInput.value;

        if (mode === 'register') {
            var username = usernameInput.value.trim();
            var password2 = password2Input.value;
            if (username.length < 3) return showError('Имя — минимум 3', usernameInput);
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Некорректный email', emailInput);
            if (password.length < 6) return showError('Пароль — минимум 6', passwordInput);
            if (password !== password2) return showError('Пароли не совпадают', password2Input);

            setLoading(true);
            apiPost('/api/register', { username: username, email: email, password: password })
                .then(function (u) {
                    currentUser = u;
                    setSession(u.username);
                    updateHeader(u); updateHome(u); updateProfile(u);
                    showPage('home');
                }).catch(function (e) { showError(e.message); })
                .then(function () { setLoading(false); });
        } else {
            if (!email) return showError('Введите имя или почту', emailInput);
            if (password.length < 1) return showError('Введите пароль', passwordInput);

            setLoading(true);
            apiPost('/api/login', { login: email, password: password })
                .then(function (u) {
                    currentUser = u;
                    setSession(u.username);
                    updateHeader(u); updateHome(u); updateProfile(u);
                    showPage('home');
                }).catch(function (e) { showError(e.message); })
                .then(function () { setLoading(false); });
        }
    });

    profileForm.addEventListener('submit', function (e) {
        e.preventDefault();
        profileError.classList.remove('visible');
        profileSuccess.classList.remove('visible');
        if (!currentUser) return;

        var newUsername = profileUsername.value.trim();
        if (newUsername.length < 3 || newUsername.length > 20) {
            profileError.textContent = 'Ник от 3 до 20';
            profileError.classList.add('visible');
            return;
        }
        var payload = { currentUsername: currentUser.username, newUsername: newUsername };
        if (pendingAvatar !== null) payload.avatar = pendingAvatar;

        profileSubmitBtn.disabled = true;
        profileSubmitBtn.textContent = 'Сохраняем...';

        apiPost('/api/update-profile', payload).then(function (u) {
            currentUser = u;
            setSession(u.username);
            updateHeader(u); updateHome(u); updateProfile(u);
            profileSuccess.textContent = 'Профиль сохранён!';
            profileSuccess.classList.add('visible');
            setTimeout(function () { profileSuccess.classList.remove('visible'); }, 2500);
        }).catch(function (e) {
            profileError.textContent = e.message;
            profileError.classList.add('visible');
        }).then(function () {
            profileSubmitBtn.disabled = false;
            profileSubmitBtn.textContent = 'Сохранить изменения';
        });
    });

    avatarInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > MAX_AVATAR_SIZE) {
            profileError.textContent = 'Файл больше 10 МБ';
            profileError.classList.add('visible');
            avatarInput.value = '';
            return;
        }
        profileError.classList.remove('visible');
        resizeImage(file, function (dataURL) {
            if (!dataURL) {
                profileError.textContent = 'Не удалось загрузить';
                profileError.classList.add('visible');
                return;
            }
            pendingAvatar = dataURL;
            profileAvatarPreview.innerHTML = '<img src="' + dataURL + '" alt="">';
        });
    });

    avatarRemoveBtn.addEventListener('click', function () {
        pendingAvatar = '';
        profileAvatarPreview.innerHTML = getInitial(currentUser ? currentUser.username : '?');
    });

    function logout() {
        clearSession();
        currentUser = null;
        updateHeader(null);
        setMode('register');
        showPage('auth');
    }

    homeLogoutBtn.addEventListener('click', logout);
    headerLoginBtn.addEventListener('click', function () { setMode('login'); showPage('auth'); });
    navHome.addEventListener('click', function () { if (currentUser) showPage('home'); });
    navProfile.addEventListener('click', function () { if (currentUser) { updateProfile(currentUser); showPage('profile'); } });
    navPeople.addEventListener('click', function () { if (currentUser) { showPage('people'); loadPeople(); } });
    homeProfileBtn.addEventListener('click', function () { if (currentUser) { updateProfile(currentUser); showPage('profile'); } });
    profileBackBtn.addEventListener('click', function () { showPage('home'); });
    headerUser.addEventListener('click', function () { if (currentUser) { updateProfile(currentUser); showPage('profile'); } });

    function loadPeople() {
        peopleList.innerHTML = '<p style="color:#9aa4c7;">Загрузка...</p>';
        apiGet('/api/users').then(function (data) {
            if (!data.users || data.users.length === 0) {
                peopleList.innerHTML = '<p style="color:#9aa4c7;">Пока никого нет</p>';
                return;
            }
            var html = '';
            for (var i = 0; i < data.users.length; i++) {
                var u = data.users[i];
                var av = u.avatar ? '<img src="' + u.avatar + '" alt="">' : getInitial(u.username);
                var date = u.createdAt ? 'С нами с ' + new Date(u.createdAt).toLocaleDateString('ru-RU') : '';
                html += '<div class="person-item"><div class="person-avatar">' + av + '</div>'
                    + '<div class="person-info"><div class="person-name">' + u.username + '</div>'
                    + '<div class="person-date">' + date + '</div></div></div>';
            }
            peopleList.innerHTML = html;
        }).catch(function () {
            peopleList.innerHTML = '<p style="color:#ff4d6d;">Ошибка</p>';
        });
    }

    var eyes = document.querySelectorAll('.eye');
    for (var i = 0; i < eyes.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                var inp = document.getElementById(btn.dataset.target);
                if (!inp) return;
                inp.type = inp.type === 'password' ? 'text' : 'password';
            });
        })(eyes[i]);
    }

    form.addEventListener('input', function (e) {
        if (e.target.classList.contains('invalid')) e.target.classList.remove('invalid');
        if (errorEl.classList.contains('visible')) errorEl.classList.remove('visible');
    });

    function init() {
        var session = getSession();
        if (session) {
            apiGet('/api/users').then(function (data) {
                var found = null;
                for (var i = 0; i < data.users.length; i++) {
                    if (data.users[i].username === session) { found = data.users[i]; break; }
                }
                if (found) {
                    currentUser = found;
                    updateHeader(found); updateHome(found); updateProfile(found);
                    showPage('home');
                } else {
                    clearSession(); updateHeader(null); setMode('register'); showPage('auth');
                }
            }).catch(function () {
                clearSession(); updateHeader(null); setMode('register'); showPage('auth');
            });
            return;
        }
        updateHeader(null); setMode('register'); showPage('auth');
    }

    setMode('register');
    init();
})();
</script>

</body>
</html>
